# Tests never reach GCP. core.enabled=false also stops spring-cloud-gcp picking up gcloud
# application default credentials.
spring.cloud.gcp.core.enabled=false
spring.cloud.gcp.pubsub.enabled=false

# No subscriber is created, so no test opens a Pub/Sub connection. AppTest asserts this.
anzu.pubsub.enabled=false

# In-memory blobs: no test touches the filesystem or resolves GCS credentials.
spring.profiles.active=test
anzu.blobstore.report-container=antu

# Not baba, which is the default: that would build an authorized WebClient and need client
# credentials. Tests mock the authorization service, so the extractor is never called.
anzu.security.role-assignment-extractor=jwt

# Datasource and Flyway are left to each test: some want Testcontainers, some want neither.
