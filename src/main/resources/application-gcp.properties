# Values backed by environment variables the chart injects, so this applies to every environment
# running on GCP and to none running outside it.

# The Cloud SQL proxy sidecar always listens on localhost.
spring.datasource.url=jdbc:postgresql://localhost:5432/anzu
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Credentials are referenced rather than copied, so an auth0 rotation needs no deploy. The whole
# registration lives here: declaring any part of it elsewhere would have Spring validate an
# incomplete registration in profiles that supply no credentials, tests included.
spring.security.oauth2.client.registration.anzu.client-id=${MNG_AUTH0_INT_CLIENT_ID}
spring.security.oauth2.client.registration.anzu.client-secret=${MNG_AUTH0_INT_CLIENT_SECRET}
spring.security.oauth2.client.registration.anzu.authorization-grant-type=client_credentials
