# anzu's own project, not antu's: short Pub/Sub names resolve against this, and the subscription
# lives here even though the topic it reads does not.
spring.cloud.gcp.project-id=ent-anzu-dev

# antu's project, which owns the report bucket.
anzu.gcp.project-id=ent-antu-dev

anzu.blobstore.report-container=ror-antu-gcp2-dev

# Fully qualified, so it stays correct regardless of spring.cloud.gcp.project-id.
anzu.pubsub.validation-status-subscription=projects/ent-anzu-dev/subscriptions/AnzuNetexValidationStatusQueue

# The user API base, not baba's root: the extractor appends /roleAssignments to it.
anzu.security.baba-url=http://baba.dev.entur.internal/services/organisations/users

anzu.oauth2.client.audience=https://api.dev.entur.io
spring.security.oauth2.client.provider.anzu.token-uri=https://internal.dev.entur.org/oauth/token

anzu.oauth2.resourceserver.partner.jwt.issuer-uri=https://partner.dev.entur.org/
anzu.oauth2.resourceserver.partner.jwt.audience=https://api.dev.entur.io
