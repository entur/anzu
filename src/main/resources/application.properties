spring.application.name=anzu

# The common chart sets COMMON_ENV to the environment name. That profile pulls in `gcp` via the
# group below, which binds the blob store to GCS and the datasource to the Cloud SQL proxy.
# dev only for now; another environment means another properties file and another group line.
spring.profiles.active=${COMMON_ENV:}
spring.profiles.group.dev=gcp

# The chart's common.service.internalPort must match this.
server.port=8080
server.shutdown=graceful
# Must stay above anzu.pubsub.shutdown-timeout, or Spring gives up on the phase before the
# subscriber has finished stopping.
spring.lifecycle.timeout-per-shutdown-phase=10s

anzu.pubsub.enabled=true

anzu.security.authorization-service=token-based

# The two endpoints WebSecurityConfig permits unauthenticated. Boot exposes `health` alone by
# default, and prometheus also needs micrometer-registry-prometheus on the classpath.
management.endpoints.web.exposure.include=health,prometheus
