name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    uses: entur/gha-docker/.github/workflows/lint.yml@v1

  openapi-lint:
    name: OpenAPI Lint
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: entur/gha-api/.github/workflows/lint.yml@v6
    with:
      path: src/main/resources/openapi/validation-reports.yaml
      upload_to_bucket: false

  maven-build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # Testcontainers needs a Docker daemon; ubuntu-24.04 ships one, so no setup step.
      - name: Build with Maven
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # On main as well as on pull requests: the image the deploy ships is built
      # from this jar, and the main run is the one handed over.
      - name: Archive build artifacts
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-artifact
          path: target/anzu-*.jar
          retention-days: 1
          overwrite: true

  docker-build:
    name: Docker Build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [maven-build, lint]
    permissions:
      contents: read
      id-token: write
    uses: entur/gha-docker/.github/workflows/build.yml@v1
    with:
      authenticate: false
      build_artifact_name: jar-artifact
      build_artifact_path: target

  smoke:
    name: Smoke
    needs: [docker-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    env:
      IMAGE: ${{ needs.docker-build.outputs.image_artifact }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.docker-build.outputs.image_artifact }}
          path: /tmp

      - name: Smoke test the image
        run: |
          docker load -i "/tmp/${IMAGE}.tar"
          timeout 180 docker run --rm "$IMAGE" > smoke.log 2>&1 || true
          if ! grep -q "using Java" smoke.log; then
            echo "::error::image did not reach Spring startup"
            cat smoke.log
            exit 1
          fi

  scan:
    needs: [docker-build]
    permissions:
      contents: write
      issues: write
      pull-requests: write
      security-events: write
      actions: read
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  trigger-deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'entur' }}
    needs: [maven-build, lint, openapi-lint, docker-build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: deploy-trigger
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        run: |
          out=$(gh api -X POST repos/entur/anzu-deployment-config/actions/workflows/deploy-handover.yml/dispatches \
            -f ref=main -f "inputs[run_id]=$GITHUB_RUN_ID" -F return_run_details=true)
          url=$(jq -r '.html_url // empty' <<<"$out" 2>/dev/null || true)
          echo "Deploy run: ${url:-https://github.com/entur/anzu-deployment-config/actions/workflows/deploy-handover.yml}" | tee -a "$GITHUB_STEP_SUMMARY"
