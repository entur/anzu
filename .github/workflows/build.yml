name: Build it

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: entur/gha-docker/.github/workflows/lint.yml@dcdc76ce2d251de20f35a92c566d8fe99036e03e # v1.13.0

  maven-build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: liberica
          cache: maven

      # Testcontainers needs a Docker daemon; ubuntu-24.04 ships one, so no setup step.
      - name: Build with Maven
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Archive build artifacts
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-artifact
          path: target/anzu-*.jar
          retention-days: 1
          overwrite: true

  # PRs only: nothing deploys from this repo yet, so main has no use for an image. The artifact
  # layout matches what docker-scan expects (artifact `anzu` holding `anzu.tar`).
  docker-build:
    name: Docker Build
    if: github.event_name == 'pull_request'
    needs: [maven-build, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      image_artifact: anzu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jar-artifact
          path: target

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: anzu
          outputs: type=docker,dest=/tmp/anzu.tar
          push: false
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=max,ignore-error=true

      # Reaching Spring's startup line proves the JRE accepted the entrypoint flags and that the
      # bytecode loaded. Failing afterwards on cluster-only configuration is expected.
      - name: Smoke test the image
        run: |
          docker load -i /tmp/anzu.tar
          timeout 180 docker run --rm anzu > smoke.log 2>&1 || true
          if ! grep -q "using Java" smoke.log; then
            echo "::error::image did not reach Spring startup"
            cat smoke.log
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anzu
          path: /tmp/anzu.tar
          retention-days: 1

  scan:
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@0962fb4f3f9004eeaea88582db8639e140ec6fda # v2.17.1
    secrets: inherit
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}
